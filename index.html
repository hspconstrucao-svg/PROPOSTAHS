<script>
const CLAUSULAS="<h1>CLÁUSULA 1\n— OBJETO E IDENTIFICAÇÃO DO EMPREENDIMENTO</h1>\n<h2>1.1. Objeto</h2>\n<p>O presente instrumento tem por objeto a prestação, pela CONTRATADA,\ndos serviços técnicos de engenharia expressamente selecionados e\ndescritos no Anexo I, com base nos documentos, projetos, levantamentos,\npremissas e informações fornecidos ou aprovados pela CONTRATANTE.</p>\n<p>Somente integram a contratação as disciplinas, atividades, produtos,\netapas e entregáveis assinalados e descritos no Anexo I e precificados\nno Anexo II. A menção de uma disciplina neste contrato não significa que\nela esteja automaticamente contratada.</p>\n<h2>1.2. Caracterização da obra</h2>\n<p>O empreendimento objeto dos serviços está identificado no\nQuadro-Resumo e no Anexo I, incluindo, quando aplicável, endereço, uso,\nárea estimada, número de pavimentos, sistema construtivo,\ncaracterísticas relevantes e documentos de referência.</p>\n<p>Qualquer divergência relevante entre as condições reais do\nempreendimento e as premissas disponibilizadas deverá ser comunicada. A\nalteração de premissas poderá exigir revisão de escopo, prazo e\nhonorários.</p>\n<h1>CLÁUSULA 2 — ESCOPO,\nPRODUTOS E METODOLOGIA</h1>\n<h2>2.1. Disciplinas possíveis</h2>\n<p>A CONTRATADA poderá executar, exclusivamente quando selecionados no\nAnexo I, os seguintes serviços:</p>\n<!--D21-->\n<h2>2.2. Produtos técnicos e\nentregáveis</h2>\n<p>Para cada disciplina contratada, o Anexo I deverá indicar os produtos\na entregar, tais como pranchas, desenhos, memoriais, especificações,\nmemoriais de cálculo quando aplicáveis, listas de materiais,\nquantitativos, planilhas, relatórios, modelos e arquivos digitais.</p>\n<p>Os documentos serão desenvolvidos no nível de detalhamento compatível\ncom a finalidade contratada e com as informações disponíveis. Itens não\nindicados no Anexo I serão considerados não incluídos, salvo ajuste\nescrito entre as partes.</p>\n<h2>2.3. Normas e critérios\ntécnicos</h2>\n<p>Os serviços serão desenvolvidos observando a legislação, normas\ntécnicas brasileiras aplicáveis e atribuições profissionais pertinentes,\nconsideradas as edições vigentes e o escopo efetivamente contratado na\ndata de desenvolvimento.</p>\n<p>Quando houver conflito entre documentos, premissas ou orientações\nfornecidas, a CONTRATADA solicitará esclarecimento à CONTRATANTE. A\ndecisão sobre premissas que dependam do proprietário, arquiteto,\nconsultor ou outro projetista deverá ser formalizada antes de sua\nincorporação.</p>\n<h2>2.4. Compatibilização e BIM</h2>\n<p>A compatibilização entre disciplinas e o uso de metodologia BIM\nsomente estarão incluídos na extensão descrita no Anexo I. O anexo\ndeverá especificar, quando aplicável, disciplinas participantes,\nformatos de intercâmbio, software/versões relevantes, entregas\nfederadas, relatórios de interferências, responsabilidades por\natualização e nível de informação esperado.</p>\n<p>A compatibilização não substitui a revisão técnica de cada disciplina\nnem transfere à CONTRATADA a responsabilidade por modelos, projetos ou\ninformações produzidos por terceiros. Não estão incluídos modelos\nnativos, famílias, bibliotecas, templates, arquivos de trabalho ou IFC,\nsalvo previsão expressa.</p>\n<h1>CLÁUSULA 3 — SERVIÇOS NÃO\nINCLUSOS</h1>\n<h2>3.1. Exclusões gerais</h2>\n<p>Salvo contratação expressa no Anexo I ou por aditivo, não estão\nincluídos:</p>\n<ul>\n<li><p>Elaboração ou alteração do projeto arquitetônico, levantamento\ncadastral, topográfico, sondagem, ensaios, laudos ou investigações de\ncampo.</p></li>\n<li><p>Alterações de arquitetura ou de premissas após o início dos\nserviços, exceto correções pontuais dentro das revisões\ncontratadas.</p></li>\n<li><p>Projetos, disciplinas, sistemas, detalhamentos ou produtos não\nlistados no Anexo I.</p></li>\n<li><p>Aprovação, protocolo ou acompanhamento de processos perante\nPrefeitura, Corpo de Bombeiros, concessionárias, cartórios ou outros\nórgãos.</p></li>\n<li><p>Taxas, emolumentos, licenças, ART de terceiros, despesas de\nórgãos públicos e custos de concessionárias.</p></li>\n<li><p>Execução da obra, fiscalização, gerenciamento, administração,\nsupervisão contínua, visitas técnicas ou assistência presencial não\nespecificadas.</p></li>\n<li><p>Impressões, plotagens, cópias físicas, deslocamentos e diárias,\nsalvo quando discriminados no Anexo II.</p></li>\n<li><p>Acompanhamento de fabricação, montagem, comissionamento, testes,\nas built ou atualização de projeto após execução, salvo previsão\nexpressa.</p></li>\n</ul>\n<h2>3.2. Serviços adicionais</h2>\n<p>Qualquer serviço não incluído será objeto de orçamento complementar.\nA CONTRATADA somente iniciará o serviço adicional após aprovação formal\ndo preço, prazo e escopo pela CONTRATANTE, mediante aditivo ou nova\nproposta.</p>\n<h1>CLÁUSULA 4 — OBRIGAÇÕES DA\nCONTRATADA</h1>\n<ul>\n<li><p>Executar os serviços contratados com diligência técnica,\nobservando as normas e atribuições profissionais aplicáveis.</p></li>\n<li><p>Designar profissional(is) habilitado(s) para as atividades sob\nsua responsabilidade e providenciar o registro da ART correspondente,\nquando exigível e pertinente às atribuições e atividades\ncontratadas.</p></li>\n<li><p>Informar à CONTRATANTE sobre inconsistências, lacunas documentais\nou interferências relevantes identificadas durante o\ndesenvolvimento.</p></li>\n<li><p>Apresentar os produtos e etapas nos formatos e prazos definidos\nneste instrumento e em seus anexos, ressalvadas as hipóteses de\nsuspensão ou reprogramação previstas.</p></li>\n<li><p>Analisar e responder às solicitações de revisão que estejam\ndentro do escopo contratado.</p></li>\n<li><p>Manter confidenciais as informações recebidas, observadas as\nhipóteses legais e as autorizações necessárias.</p></li>\n</ul>\n<h1>CLÁUSULA 5 — OBRIGAÇÕES DA\nCONTRATANTE</h1>\n<ul>\n<li><p>Fornecer, em tempo hábil, projeto arquitetônico aprovado para\ndesenvolvimento, levantamentos, sondagens, informações de uso, cargas,\nequipamentos, especificações, documentos e demais dados\nnecessários.</p></li>\n<li><p>Garantir que os documentos e informações fornecidos sejam\ncorretos, completos, atualizados e autorizados para uso,\nresponsabilizando-se por sua origem e conteúdo.</p></li>\n<li><p>Indicar um representante para centralizar comunicações, decisões\ne aprovações.</p></li>\n<li><p>Analisar as entregas e encaminhar comentários consolidados,\nclaros e por escrito nos prazos previstos.</p></li>\n<li><p>Efetuar os pagamentos nas datas e condições acordadas.</p></li>\n<li><p>Não executar, alterar, adaptar ou permitir que terceiros alterem\nsoluções técnicas sem avaliação dos responsáveis técnicos\npertinentes.</p></li>\n<li><p>Contratar profissionais habilitados para execução da obra e\nprovidenciar as licenças, autorizações e responsabilidades que não\nintegrem este escopo.</p></li>\n</ul>\n<h1>CLÁUSULA 6 — PRAZOS,\nETAPAS E DEPENDÊNCIAS</h1>\n<h2>6.1. Início da contagem</h2>\n<p>O prazo indicado no Quadro-Resumo e detalhado no Anexo III começará a\ncontar após o cumprimento conjunto das seguintes condições: (a)\nassinatura ou aceite formal do contrato; (b) pagamento da parcela\ninicial, quando prevista; e (c) recebimento, pela CONTRATADA, dos\ndocumentos e informações indispensáveis ao início das disciplinas\ncontratadas.</p>\n<h2>6.2. Cronograma</h2>\n<p>O cronograma poderá contemplar: recebimento e conferência de\ndocumentos; desenvolvimento por disciplina; compatibilização, se\ncontratada; apresentação para análise; revisões previstas; e emissão\nfinal.</p>\n<p>Os prazos de análise da CONTRATANTE e de terceiros não serão\ncomputados como tempo de produção da CONTRATADA. Atrasos no fornecimento\nde documentos, decisões ou aprovações pelo cliente implicarão\nreprogramação proporcional do cronograma.</p>\n<h2>6.3. Revisão do prazo</h2>\n<p>O prazo poderá ser revisto por alteração de escopo, mudança de\npremissas, inclusão de serviços, atraso de informações, exigências\nsupervenientes de terceiros, caso fortuito, força maior ou outros fatos\nque afetem objetivamente a execução. A CONTRATADA comunicará a\nocorrência e apresentará a estimativa de reprogramação.</p>\n<p>Solicitações de prazo reduzido ou entrega prioritária dependerão de\nviabilidade técnica e disponibilidade da equipe, podendo exigir\nhonorários adicionais previamente aprovados.</p>\n<h1>CLÁUSULA 7 —\nANÁLISE, APROVAÇÃO E COMUNICAÇÕES</h1>\n<h2>7.1. Análise das entregas</h2>\n<p>A CONTRATANTE deverá analisar cada entrega parcial em até 05 (cinco)\ndias úteis, ou no prazo diverso indicado no Anexo III, e encaminhar\ncomentários consolidados por escrito. A ausência de manifestação não\nserá interpretada como aprovação automática de solução técnica nem\nautorizará a execução de obra com base em documento não liberado para\nessa finalidade.</p>\n<p>Se a CONTRATANTE não se manifestar no prazo, a CONTRATADA poderá\nsuspender a etapa subsequente e reprogramar o cronograma, mediante\ncomunicação.</p>\n<h2>7.2. Canais oficiais</h2>\n<p>Serão considerados canais oficiais os endereços de e-mail e números\nde telefone/WhatsApp informados no Quadro-Resumo, desde que seja\npossível comprovar o envio e o conteúdo da comunicação. Aprovações de\npremissas, alterações de escopo, valores e prazos deverão ser\nregistradas por escrito.</p>\n<h1>CLÁUSULA 8 —\nREVISÕES E ALTERAÇÕES DE ESCOPO</h1>\n<h2>8.1. Revisões incluídas</h2>\n<p>Estão incluídas até 02 (duas) rodadas de revisão por disciplina\ncontratada, desde que solicitadas de forma consolidada e que preservem\nas premissas, o programa, a arquitetura e as condições inicialmente\naprovadas. O Anexo I poderá estabelecer quantidade ou regra diferente\npara uma disciplina específica.</p>\n<h2>8.2. Correções técnicas</h2>\n<p>Correções de inconsistências ou erros imputáveis à CONTRATADA,\nidentificados de forma objetiva e relacionados ao escopo contratado,\nserão analisadas e corrigidas sem cobrança adicional, observados os\nlimites da responsabilidade técnica e os prazos razoáveis de\ncorreção.</p>\n<h2>8.3. Alterações que\nconfiguram serviço adicional</h2>\n<p>Não serão consideradas revisões incluídas: mudança de arquitetura,\nlayout, área, pavimentos, uso, sistema construtivo, cargas,\nequipamentos, critérios de desempenho, premissas de projeto ou soluções\njá aprovadas; alteração decorrente de informação incorreta, incompleta\nou omitida pela CONTRATANTE; adequação a exigência superveniente que\naltere substancialmente o escopo; e solicitação de novo produto ou\nformato não contratado.</p>\n<p>Os serviços adicionais dependerão de proposta complementar, com\ndescrição do impacto em honorários e prazo, e de aprovação formal antes\ndo início.</p>\n<h1>CLÁUSULA 9 —\nHONORÁRIOS, PAGAMENTO E TRIBUTOS</h1>\n<h2>9.1. Preço</h2>\n<p>O valor total da contratação, a discriminação por disciplina, os\nprodutos incluídos, as parcelas, os vencimentos e os meios de pagamento\nconstam do Anexo II, que integra este instrumento.</p>\n<h2>9.2. Condições de pagamento</h2>\n<p>Os pagamentos serão realizados por transferência, PIX, boleto ou\noutro meio indicado pela CONTRATADA, mediante identificação do pagador e\nemissão do documento fiscal cabível, conforme a legislação aplicável. Os\ndados de pagamento serão informados em documento de cobrança ou canal\noficial da empresa.</p>\n<p>A emissão de nota fiscal ou documento fiscal obrigatório não\nconstitui serviço opcional nem justificativa para cobrança de adicional\nespecífico. Os tributos incidentes deverão ser considerados na formação\ndos honorários e tratados conforme o regime tributário aplicável.</p>\n<h2>9.3. Atraso</h2>\n<p>Em caso de atraso superior a 10 (dez) dias corridos, contados do\nvencimento, poderá incidir multa moratória de 2% (dois por cento) sobre\no valor vencido e não pago, além de juros de mora de 1% (um por cento)\nao mês, calculados proporcionalmente aos dias de atraso, observada a\nlegislação aplicável. A CONTRATADA poderá, mediante comunicação,\nsuspender os serviços enquanto persistir a inadimplência, com\nreprogramação dos prazos.</p>\n<h2>9.4. Despesas</h2>\n<p>Despesas extraordinárias, deslocamentos, impressões, plotagens, taxas\ne serviços de terceiros somente serão cobrados quando previstos no Anexo\nII ou previamente aprovados pela CONTRATANTE.</p>\n<h1>CLÁUSULA 10 —\nSUSPENSÃO E RETOMADA DOS SERVIÇOS</h1>\n<h2>10.1. Hipóteses</h2>\n<p>A CONTRATADA poderá suspender temporariamente os serviços mediante\ncomunicação formal quando houver inadimplência, ausência de documentos\nou definições indispensáveis, solicitação da CONTRATANTE, impedimento\ntécnico ou legal, ou outra situação que impossibilite a continuidade\nadequada.</p>\n<h2>10.2. Efeitos</h2>\n<p>Durante a suspensão, os prazos ficarão interrompidos e serão\nreprogramados considerando a data de regularização e a disponibilidade\nde equipe. Custos comprovados e extraordinários de desmobilização ou\nretomada somente serão cobrados se previamente justificados e aprovados,\nressalvados os direitos legais das partes.</p>\n<h1>CLÁUSULA 11 — ENTREGA,\nFORMATOS E ARQUIVOS</h1>\n<h2>11.1. Entrega</h2>\n<p>A entrega será realizada pelos meios digitais indicados no Anexo I,\ncom identificação de revisão, data e status do documento. Quando\ncontratadas cópias físicas, quantidade, formato, local de entrega e\ncustos deverão constar do Anexo II.</p>\n<h2>11.2. Formatos</h2>\n<p>PDF e DWG serão entregues somente quando assinalados no Anexo I.\nModelos BIM nativos, IFC, planilhas editáveis, arquivos de cálculo,\nfamílias, bibliotecas, templates, arquivos intermediários e demais\narquivos-fonte somente serão entregues quando expressamente\ndiscriminados, com indicação de versão e finalidade.</p>\n<h2>11.3. Guarda de arquivos</h2>\n<p>A CONTRATADA manterá cópia dos arquivos finais pelo prazo de 12\n(doze) meses após a entrega final, como política operacional, sem\nsubstituir a obrigação da CONTRATANTE de manter cópias de segurança.\nApós esse prazo, a manutenção ou recuperação poderá depender de\ndisponibilidade e orçamento específico.</p>\n<h2>11.4. Uso para execução</h2>\n<p>Somente documentos identificados como finais/liberados para execução\ndeverão ser utilizados na obra. Estudos, versões preliminares, arquivos\nem revisão ou modelos não aprovados não constituem documentação\nexecutiva.</p>\n<h1>CLÁUSULA 12 —\nDIREITOS AUTORAIS E LICENÇA DE USO</h1>\n<h2>12.1. Autoria e propriedade\nintelectual</h2>\n<p>Os direitos autorais e demais direitos de propriedade intelectual\nsobre os projetos, desenhos, modelos, memoriais e soluções originais\npermanecem com seus respectivos autores e titulares, observada a\nlegislação aplicável. A identificação de autoria e responsabilidade\ntécnica deverá ser preservada.</p>\n<h2>12.2. Licença de uso</h2>\n<p>Após a quitação integral dos valores contratados, a CONTRATANTE\nrecebe licença de uso dos documentos finais para a execução e operação\ndo empreendimento identificado neste contrato, nos limites do escopo\ncontratado. A licença não autoriza reutilização em outro imóvel,\nempreendimento ou finalidade, nem reprodução ou cessão a terceiros para\noutros projetos, sem autorização escrita dos titulares.</p>\n<h2>12.3. Modificações por\nterceiros</h2>\n<p>Modificações realizadas por terceiros sem anuência e análise do\nresponsável técnico deverão ser identificadas como intervenções de\nterceiros. A CONTRATADA não responderá tecnicamente por alterações que\nnão tenha elaborado, analisado ou assumido formalmente, sem prejuízo das\nresponsabilidades legais que não possam ser afastadas por contrato.</p>\n<h1>CLÁUSULA 13\n— RESPONSABILIDADE TÉCNICA, ART E EXECUÇÃO</h1>\n<h2>13.1. Limites do escopo técnico</h2>\n<p>A responsabilidade da CONTRATADA limita-se às atividades\nprofissionais efetivamente contratadas, desenvolvidas e registradas na\nART correspondente, respeitadas as atribuições legais do(s)\nprofissional(is) responsável(is). A ART será providenciada conforme a\nlegislação e os normativos vigentes do Sistema CONFEA/CREA.</p>\n<h2>13.2. Execução da obra</h2>\n<p>A contratação de elaboração de projetos não inclui automaticamente\nexecução, fiscalização, gerenciamento, administração, acompanhamento\ncontínuo, visitas periódicas ou responsabilidade pela execução da obra.\nTais serviços dependerão de contratação própria e ART correspondente,\nquando aplicável.</p>\n<h2>13.3.\nResponsabilidades de terceiros e alterações em campo</h2>\n<p>A execução deverá observar os documentos finais e ser conduzida por\nprofissionais legalmente habilitados. A CONTRATANTE deverá submeter ao\nresponsável técnico alterações que afetem as soluções projetadas. A\nCONTRATADA não assume responsabilidade por execução divergente,\nmateriais substituídos, alterações de campo ou serviços de terceiros que\nnão estejam sob sua contratação e controle, respeitados os limites\nlegais.</p>\n<h2>13.4. Aprovações externas</h2>\n<p>A CONTRATADA não garante deferimento, licenciamento ou prazo de\nanálise por órgãos públicos, concessionárias ou entidades de terceiros,\nsalvo obrigação específica expressamente contratada. Exigências externas\nque impliquem novo escopo serão tratadas conforme a Cláusula 8.</p>\n<h1>CLÁUSULA 14 —\nCONFIDENCIALIDADE E PROTEÇÃO DE DADOS</h1>\n<h2>14.1. Confidencialidade</h2>\n<p>As partes comprometem-se a utilizar informações técnicas, comerciais\ne pessoais recebidas em razão deste contrato somente para sua execução,\nnão as divulgando a terceiros sem autorização, exceto quando necessário\nà prestação dos serviços, exigido por lei ou autorizado pela parte\ntitular.</p>\n<h2>14.2. Dados pessoais</h2>\n<p>As partes tratarão os dados pessoais estritamente necessários à\ncontratação, comunicação, execução, cobrança e cumprimento de obrigações\nlegais, adotando medidas razoáveis de segurança e observando a Lei nº\n13.709/2018 (LGPD). Quando necessário, os dados poderão ser\ncompartilhados com prestadores de serviços, plataformas de assinatura,\ninstituições financeiras, contabilidade, órgãos profissionais ou\nautoridades, limitados à finalidade pertinente.</p>\n<h1>CLÁUSULA 15 — RESCISÃO E\nENCERRAMENTO</h1>\n<h2>15.1. Rescisão</h2>\n<p>O contrato poderá ser encerrado por acordo entre as partes ou por\niniciativa de qualquer delas, mediante comunicação escrita com\nantecedência de 10 (dez) dias, sem prejuízo da possibilidade de\nresolução imediata nas hipóteses legais ou em caso de descumprimento\ncontratual não sanado após notificação e prazo razoável para\ncorreção.</p>\n<h2>15.2. Acerto financeiro</h2>\n<p>Na data de encerramento, as partes apurarão os serviços efetivamente\nexecutados, etapas concluídas, atividades em andamento passíveis de\naproveitamento, despesas previamente autorizadas e valores já pagos.\nEventual saldo a pagar ou restituir será calculado com base nessa\napuração e nas disposições legais aplicáveis. Não haverá retenção\nautomática e integral de valores sem correspondência com serviços ou\ndespesas devidas.</p>\n<h2>15.3. Entrega no encerramento</h2>\n<p>Após o acerto financeiro, a CONTRATADA disponibilizará os produtos\nconcluídos e quitados que possam ser entregues em condições técnicas\nadequadas, identificando seu status. Documentos preliminares ou\nincompletos não deverão ser utilizados para execução.</p>\n<h1>CLÁUSULA\n16 — CASO FORTUITO, FORÇA MAIOR E IMPEDIMENTOS</h1>\n<p>Nenhuma das partes será responsabilizada por atraso diretamente\ncausado por evento de caso fortuito ou força maior, nos termos da\nlegislação, desde que comunique a outra parte em prazo razoável e adote\nmedidas proporcionais para mitigar os efeitos. Os prazos e, se\nnecessário, o escopo serão reavaliados de comum acordo.</p>\n<h1>CLÁUSULA 17 —\nDISPOSIÇÕES GERAIS E ASSINATURA</h1>\n<ul>\n<li><p>Este contrato, seu Quadro-Resumo e anexos representam o acordo\nintegral das partes sobre o objeto contratado e substituem entendimentos\nanteriores sobre o mesmo escopo.</p></li>\n<li><p>Qualquer alteração de escopo, preç const g=x=>{const m=Math.floor(x/1e6),k=Math.floor(x%1e6/1000),u=x%1000,p=[];if(m)p.push(t(m)+(m==1?' milhão':' milhões'));if(k)p.push(k==1?'mil':t(k)+' mil');if(u)p.push(t(u));
 if(p.length<2)return p[0]||'';const last=p.pop();return p.join(', ')+(u&&(u<100||u%100==0)||!u?' e ':', ')+last};
let s=r?g(r)+(r==1?' real':(r%1e6==0&&r>=1e6?' de reais':' reais')):'';if(c)s+=(s?' e ':'')+t(c)+(c==1?' centavo':' centavos');return s}

document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k||k=='_')return;let v=t.type=='checkbox'?t.checked:t.type=='number'?(t.value===''?'':parseFloat(t.value)):t.dataset.num?parseInt(t.value):t.value;set(k,v);save();
 if(t.dataset.re){document.getElementById('form').innerHTML=formHTML()}renderDoc();updForm();updValores();updHoras()});
document.addEventListener('click',e=>{const t=e.target;if(t.dataset.del!==undefined){S.desp.splice(+t.dataset.del,1);save();renderHV()}if(t.id=='addD'){S.desp.push({n:'Nova despesa',v:''});save();renderHV()}
 if(t.dataset.p){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b==t));document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id=='p-'+t.dataset.p))}});
renderAll();
const H=s=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
const AUTH='8jeo234qyx';let ss={getItem(){return null},setItem(){},removeItem(){}};try{ss=sessionStorage}catch(e){}
const lock=on=>document.body.classList.toggle('locked',on);
if(ss.getItem('hs_auth')===AUTH)lock(false);else setTimeout(()=>document.getElementById('lu').focus(),50);
document.getElementById('lf').addEventListener('submit',e=>{e.preventDefault();const u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value;
 if(H(u+'|'+p)===AUTH){ss.setItem('hs_auth',AUTH);document.getElementById('lp').value='';document.getElementById('le').textContent='';lock(false)}else document.getElementById('le').textContent='Login ou senha incorretos'});
document.getElementById('sair').addEventListener('click',()=>{ss.removeItem('hs_auth');lock(true)});
</script>
